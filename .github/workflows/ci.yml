name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Syntax and tests
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python3 -m py_compile build-app.py install-app.py package-release.py
          for script in panda-companion test.zsh test-all.zsh Install.command; do zsh -n "$script"; done
          zsh test-all.zsh
      - name: Build
        run: python3 build-app.py
      - name: Package and verify isolated install
        run: python3 package-release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PandaCompanion-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
