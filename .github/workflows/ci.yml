name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and tests
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python3 -m py_compile build-app.py install-app.py package-release.py
          for script in panda-companion test.zsh test-all.zsh Install.command; do zsh -n "$script"; done
          zsh test-all.zsh
      - name: Build
        run: python3 build-app.py
      - name: Package and verify isolated install
        run: python3 package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PandaCompanion-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
